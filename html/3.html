<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BYTRIP | 여행 떠나기</title>
  <link rel="icon" type="image/png" href="../이미지 폴더/mark.png">
  <style>
    :root { --ink: #183b4b; --mint: #62d0be; --sky: #8fd5e6; --paper: #f5f9f7; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); font-family: Arial, sans-serif; background: #0b2232; }
    header { position: fixed; top: 0; right: 0; left: 0; z-index: 20; display: flex; align-items: center; gap: 20px; padding: 15px 8%; background: rgba(255,255,255,.92); border-bottom: 1px solid rgba(219,233,229,.75); }
    .logo { display: flex; align-items: center; gap: 8px; margin-right: auto; color: var(--ink); font-size: 22px; font-weight: bold; text-decoration: none; }
    .logo img { width: 32px; height: 32px; }
    .back-link { color: var(--ink); font-size: 15px; text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
    main { position: relative; width: 100%; height: 100vh; min-height: 720px; overflow: hidden; }
    main > .eyebrow, main > h1, main > .intro { position: absolute; z-index: 4; left: 8%; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.38); }
    main > .eyebrow { top: 136px; margin: 0; color: #86e8d9; font-size: 12px; font-weight: bold; letter-spacing: .15em; }
    h1 { top: 161px; max-width: 600px; margin: 0; font-size: clamp(32px, 5vw, 54px); letter-spacing: -.05em; }
    .intro { top: 326px; max-width: 570px; margin: 0; color: #d5eded !important; line-height: 1.7; }
    .globe-wrap { position: absolute; inset: 0; min-height: 100%; overflow: hidden; background: radial-gradient(circle at 50% 50%, #236679 0, #123d50 36%, #0b2232 77%); }
    #globe { width: 100%; height: 100%; min-height: 100%; cursor: grab; touch-action: none; }
    #globe:active { cursor: grabbing; }
    .info { position: absolute; z-index: 5; right: 7%; bottom: 92px; width: min(410px, calc(100% - 40px)); max-height: 335px; overflow: auto; margin: 0; padding: 24px 28px; border: 1px solid rgba(255,255,255,.28); border-radius: 18px; color: #f7ffff; background: rgba(7, 31, 43, .78); box-shadow: 0 10px 32px rgba(0,0,0,.22); backdrop-filter: blur(12px); }
    .info h2 { margin: 5px 0 8px; font-size: 30px; }
    .info p { color: #d7eeef; line-height: 1.65; }
    .country-name { color: #8cf0df !important; font-size: 14px; font-weight: bold; letter-spacing: .08em; }
    .plan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
    .plan-grid div { padding: 11px; border-radius: 10px; background: rgba(255,255,255,.08); }
    .plan-grid span { display: block; margin-bottom: 4px; color: #99c6c8; font-size: 11px; font-weight: bold; }
    .plan-grid strong { font-size: 13px; line-height: 1.35; }
    .itinerary-label { margin: 18px 0 8px; color: #8ce5d7 !important; font-size: 13px; font-weight: bold; }
    .itinerary { margin: 0; padding: 0; list-style: none; }
    .itinerary li { display: grid; grid-template-columns: 40px 1fr; gap: 7px; margin: 10px 0; color: #e2f1f1; font-size: 13px; line-height: 1.5; }
    .itinerary li strong { padding-top: 2px; color: #81e1d2; font-size: 10px; }
    .source-link { margin: 12px 0 0; font-size: 12px; }
    .source-link a { color: #8ce5d7; text-decoration: none; }
    .source-link a:hover { text-decoration: underline; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; padding: 0; list-style: none; }
    .tags li { padding: 7px 10px; border-radius: 99px; color: #d8fffa; font-size: 13px; background: rgba(98,208,190,.18); }
    .tip { margin-top: 22px; padding-top: 17px; border-top: 1px solid rgba(255,255,255,.2); font-size: 14px; }
    .planner-tools { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; margin-top: 18px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.18); }
    .planner-tools span { width: 100%; margin-bottom: 2px; color: #9bcaca; font-size: 12px; font-weight: bold; }
    .planner-tools button { padding: 7px 10px; border: 1px solid rgba(205,244,238,.3); border-radius: 8px; color: #eafffb; font: inherit; font-size: 12px; background: rgba(255,255,255,.08); cursor: pointer; }
    .planner-tools button:hover, .planner-tools button:focus, .planner-tools button.is-selected { border-color: #71dacb; background: rgba(67,160,149,.45); outline: none; }
    .planner-tools .wish-button { margin-left: auto; border-color: rgba(255,209,102,.5); color: #ffe7a2; }
    .country-loading { color: #a5d6d4; font-size: 12px; }
    .region-controls { position: absolute; top: 102px; right: 7%; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; }
    .region-controls button { padding: 10px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 99px; color: #fff; font: inherit; background: rgba(11,39,54,.66); cursor: pointer; }
    .region-controls button:hover, .region-controls button:focus { border-color: var(--mint); background: #1d6e70; outline: none; }
    .guide { position: absolute; top: 96px; left: 8%; z-index: 5; margin: 0; color: #d5f3f0; font-size: 14px; }
    .loading { display: grid; height: 100%; min-height: 570px; place-items: center; color: #d5f3f0; }
    @media (max-width: 800px) { main { min-height: 760px; } main > .eyebrow { top: 92px; left: 20px; } h1 { top: 116px; left: 20px; font-size: 36px; } .intro { top: 232px; left: 20px; right: 20px; font-size: 14px; } .globe-wrap, #globe, .loading { min-height: 100%; } .info { right: 16px; bottom: 22px; left: 16px; width: auto; max-height: 250px; padding: 20px; } .region-controls { top: 326px; right: 18px; left: 18px; justify-content: center; } .guide { top: 298px; left: 20px; } }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="travel-menu.html"><img src="../이미지 폴더/mark.png" alt=""><span>BYTRIP</span></a>
    <a class="back-link" href="travel-menu.html">← 메인으로 돌아가기</a>
  </header>
  <main>
    <p class="eyebrow">만족스러운 여행, 떠날 준비 되셨나요?</p>
    <h1>지구본을 돌려<br>다음 여행지를 찾아보세요.</h1>
    <p class="intro">마우스로 지구본을 드래그해 돌리고, 휠로 확대할 수 있습니다. 현재는 아시아와 오세아니아의 여행 정보만 선택할 수 있어요.</p>
    <section class="globe-wrap" aria-label="인터랙티브 세계 여행 지도">
      <p class="guide">드래그하여 회전 · 휠로 확대, 축소 </p>
      <div id="globe"><div class="loading">지구본을 불러오는 중입니다…</div></div>
      <div class="region-controls">
        <button type="button" data-region="asia">아시아 보기</button>
        <button type="button" data-region="oceania">오세아니아 보기</button>
      </div>
      <article class="info" id="travel-info" aria-live="polite"></article>
    </section>
  </main>

  <script src="https://unpkg.com/globe.gl@2.46.2"></script>
  <script src="../js/travel-country-data.js"></script>
  <script src="../js/world-data.js"></script>
  <script>
    const regions = {
      asia: { title: "아시아 여행", subtitle: "도시와 전통을 함께", text: "감각적인 골목, 고즈넉한 사찰과 맛있는 식사를 한 번에 즐길 수 있는 다채로운 여행지입니다.", tags: ["봄·가을 추천", "미식", "대중교통 여행"], tip: "여행 팁: 현지 교통카드와 기본 회화 표현을 미리 준비해 보세요.", view: { lat: 32, lng: 108, altitude: 1.8 } },
      oceania: { title: "오세아니아 여행", subtitle: "바다 곁의 도시 휴식", text: "푸른 해변과 웅장한 자연, 여유로운 도시 문화가 조화를 이루는 여행지입니다.", tags: ["9~11월 추천", "해변", "자연 탐험"], tip: "여행 팁: 계절이 한국과 반대일 수 있으니 출발 전 날씨를 확인하세요.", view: { lat: -25, lng: 138, altitude: 1.8 } }
    };
    const countryPlans = {
      "Japan": { korean: "일본", title: "도쿄 3일 미식 산책", season: "3~5월 · 10~11월", budget: "1일 약 13~20만 원", transport: "스이카·파스모 + JR·도쿄 메트로", route: ["시부야역 하치코 출구 → 스크램블 교차로 → 메이지 신궁·하라주쿠 다케시타도리. 저녁은 신주쿠 골든가이 주변", "아사쿠사 센소지·나카미세 상점가를 오전에 둘러보고, 오후 우에노 공원·도쿄국립박물관·아메요코 시장", "도쿄역 마루노우치 산책 후 긴자 백화점·가부키자 주변. 저녁 유라쿠초 고가 아래 이자카야", "4~5일이면 오모테산도 건축 산책과 아키하바라 전자상가를 추가", "7일 일정은 가마쿠라 또는 하코네 당일치기로 확장"], tip: "GO TOKYO의 3일 동선을 참고해 동쪽(아사쿠사·우에노)과 서쪽(시부야·하라주쿠)을 날짜별로 묶었습니다. IC카드는 지하철·편의점 결제에 사용할 수 있습니다.", source: "https://www.gotokyo.org/en/story/walks-and-tours/best-of-tokyo/index.html" },
      "South Korea": { korean: "대한민국", title: "서울 3일 전통과 로컬 여행", season: "3~5월 · 9~11월", budget: "1일 약 8~15만 원", transport: "티머니·지하철, 도보 구간 병행", route: ["경복궁 개장 시간에 맞춰 관람 → 북촌 한옥마을 골목 산책 → 서촌 통인시장 점심. 주거지에서는 조용히 걷기", "성수역에서 서울숲까지 도보 이동, 편집숍·카페를 탐방하고 서울숲에서 휴식", "광화문·청계천 산책 후 해질 무렵 한강공원으로 이동해 강변 야경 감상", "4~5일이면 창덕궁·익선동과 남산 코스를 추가", "7일 일정은 홍대·망원시장, 국립중앙박물관, 북악산 산책 중 취향에 맞게 선택"], tip: "북촌은 실제 주민 거주지이므로 정숙하게 방문하세요. 경복궁·박물관은 휴관일과 예약 여부를 공식 페이지에서 출발 전에 확인하세요.", source: "https://english.visitseoul.net/attractions/bukchon-hanok-village/ENP000261" },
      "Thailand": { korean: "태국", title: "방콕 3일 사원과 강변 여행", season: "11~2월", budget: "1일 약 7~13만 원", transport: "BTS·MRT + 짜오프라야 익스프레스 보트", route: ["오전 왕궁·에메랄드 사원 관람 → 도보로 왓 포 와불상 관람 → 타 티엔 선착장 강변 식사", "왓 아룬을 오전에 둘러본 뒤 강 건너 이동, 오후 아이콘시암과 사톤 피어 주변", "주말이면 짜뚜짝 시장, 평일이면 차이나타운 야오와랏 저녁 먹거리와 강변 야경", "4~5일이면 아유타야 유적 당일 투어를 추가", "7일 일정은 수상시장 또는 현지 쿠킹 클래스와 휴식일을 포함"], tip: "왕궁·사원에는 어깨와 무릎을 가리는 복장이 필요합니다. 낮 더위와 교통 체증을 고려해 사원은 오전, 실내 일정은 한낮에 배치하세요.", source: "https://www.tourismthailand.org/Destinations/Provinces/Bangkok/219" },
      "Vietnam": { korean: "베트남", title: "하노이 3일 구시가지 산책", season: "10~4월", budget: "1일 약 6~11만 원", transport: "구시가지 도보·그랩 차량", route: ["호안끼엠 호수와 응옥선 사당 → 36거리 구시가지 골목 → 동쑤언 시장에서 현지 간식", "문묘·국자감 오전 관람 → 호찌민 묘소 주변 바딘 광장 → 서호 카페에서 휴식", "탕롱 황성 또는 베트남 여성박물관 → 저녁 구시가지 야시장(운영 요일 확인)", "4~5일이면 하롱베이 또는 닌빈 1박 투어를 추가", "7일 일정은 하노이 3일과 하롱베이·닌빈 각 1~2일로 분배"], tip: "구시가지는 걸어서 둘러보기 좋지만 보도에 오토바이가 주차된 곳이 많습니다. 도로는 급히 뛰지 말고 일정한 속도로 건너세요.", source: "https://vietnam.travel/things-to-do/explore-old-quarter-your-way" },
      "Singapore": { korean: "싱가포르", title: "싱가포르 3일 정원과 문화", season: "연중", budget: "1일 약 16~25만 원", transport: "MRT·이지링크 또는 비접촉 결제", route: ["마리나베이 산책 → 멀라이언 파크 → 가든스 바이 더 베이 플라워돔·클라우드 포레스트. 저녁 슈퍼트리 조명 시간 확인", "차이나타운 헤리티지 센터·불아사·스리 마리암만 사원 → 맥스웰 또는 차이나타운 콤플렉스 호커센터", "캄퐁글람 술탄 모스크와 하지레인 → 싱가포르 리버 보트 투어 또는 주얼 창이", "4~5일이면 센토사 해변과 유니버설 스튜디오를 하루로 배정", "7일 일정은 리틀인디아·국립박물관·나이트 사파리를 추가"], tip: "가든스 바이 더 베이 온실은 별도 입장권이 필요하며 휴관일이 있을 수 있습니다. 야외와 냉방 강한 실내를 오가므로 얇은 겉옷을 준비하세요.", source: "https://www.visitsingapore.com/travel-tips/travelling-to-singapore/itineraries/singapore-city-tour-guide/" },

    }
    function showRegion(id) { if (globe) globe.pointOfView(regions[id].view, 900); }
    function selectCountry(name) {
      const feature = window.worldCountries && window.worldCountries.find(item => countryName(item) === name);
      showCountry(feature || { properties: { name: name } });
    }
    function startGlobe(countries) {
      document.getElementById("globe").innerHTML = "";
      globe = Globe()(document.getElementById("globe"))
        .globeImageUrl("https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg")
        .bumpImageUrl("https://unpkg.com/three-globe/example/img/earth-topology.png")
        .backgroundImageUrl("https://unpkg.com/three-globe/example/img/night-sky.png")
        .polygonsData(countries.features)
        .polygonAltitude(feature => regionOf(feature) ? 0.018 : 0.006)
        .polygonCapColor(feature => countryName(feature) === selectedCountry ? "rgba(255, 209, 102, .92)" : regionOf(feature) === "asia" ? "rgba(98, 208, 190, .74)" : regionOf(feature) === "oceania" ? "rgba(116, 183, 255, .78)" : "rgba(140, 165, 174, .22)")
        .polygonSideColor(() => "rgba(15, 70, 86, .6)")
        .polygonStrokeColor(() => "rgba(215, 249, 248, .42)")
        .onPolygonHover(feature => {
          document.getElementById("globe").style.cursor = feature && regionOf(feature) ? "pointer" : "grab";
        })
        .onPolygonClick(feature => {
          if (feature && regionOf(feature)) { showCountry(feature); globe.polygonsData(countries.features); }
        });
      window.travelGlobe = globe;
      window.worldCountries = countries.features;
      globe.controls().autoRotate = false;
      globe.controls().enableRotate = true;
      globe.controls().enableZoom = true;
      globe.controls().enablePan = false;
      globe.controls().enableDamping = true;
      globe.controls().rotateSpeed = .8;
      globe.pointOfView(regions.asia.view, 0);
      const selected = countries.features.find(feature => countryName(feature) === selectedCountry);
      if (selected) showCountry(selected);
    }
    function showLoadError() {
      document.getElementById("globe").innerHTML = '<div class="loading">지구본을 불러오지 못했습니다.<br>인터넷 연결을 확인한 뒤 새로고침해 주세요.</div>';
    }

    fetch("https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson")
      .then(response => {
        if (!response.ok) throw new Error("국가 경계 데이터를 불러오지 못했습니다.");
        return response.json();
      })
      .then(startGlobe)
      .catch(() => {
        if (window.WORLD_GEOJSON && window.WORLD_GEOJSON.features) startGlobe(window.WORLD_GEOJSON);
        else showLoadError();
      });
    document.querySelectorAll("[data-region]").forEach(button => button.addEventListener("click", () => showRegion(button.dataset.region)));
    document.getElementById("travel-info").addEventListener("click", event => {
      const dayButton = event.target.closest("[data-days]");
      if (dayButton) { selectedDays = Number(dayButton.dataset.days); renderCountryInfo(); return; }
      if (event.target.closest("[data-wishlist]")) {
        const saved = JSON.parse(localStorage.getItem("bytrip-wishlist") || "[]");
        const index = saved.indexOf(selectedCountry);
        if (index === -1) saved.push(selectedCountry); else saved.splice(index, 1);
        localStorage.setItem("bytrip-wishlist", JSON.stringify(saved));
        renderCountryInfo();
      }
    });
    selectCountry("Japan");
  </script>
</body>
</html>
